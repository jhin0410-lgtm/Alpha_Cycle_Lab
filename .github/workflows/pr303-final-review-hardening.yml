name: PR303 final review hardening

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr303-final-review-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/work"
          git checkout -B "${GITHUB_REF_NAME}" refs/remotes/origin/work
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply exact-head hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr303_apply_final_review_hardening.py
          rm -f scripts/pr303_apply_final_review_hardening.py
          rm -f .github/workflows/pr303-final-review-hardening.yml

      - name: Normalize patched source and test loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/alpha_cycle/research_package_source_revalidation_v2_1.py")
          text = source.read_text(encoding="utf-8")
          old = "{str(key): item for key, item in cast(dict[object, object], raw).items()}"
          new = "{str(key): item for key, item in raw.items()}"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one redundant-cast source expression")
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/unit/test_research_package_exact_head_review_v2_1.py")
          text = test.read_text(encoding="utf-8")
          old = '''from tests.unit.test_research_package_assembler_v2_1 import (\n    _components,\n    _persist_components,\n    _prepare_ready_request,\n)\n'''
          new = '''from runpy import run_path\n\n_FIXTURE = run_path(\n    str(Path(__file__).with_name("test_research_package_assembler_v2_1.py"))\n)\n_components = _FIXTURE["_components"]\n_persist_components = _FIXTURE["_persist_components"]\n_prepare_ready_request = _FIXTURE["_prepare_ready_request"]\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one generated fixture import block")
          test.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"PR303 hardening requires Python 3.12, found {sys.version}")
          PY
          python3 -m venv .venv-pr303
          .venv-pr303/bin/python -m pip install --upgrade pip
          .venv-pr303/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          .venv-pr303/bin/ruff check tests/unit/test_research_package_assembler_v2_1.py --fix
          .venv-pr303/bin/ruff check tests/unit/test_research_package_exact_head_review_v2_1.py --fix
          .venv-pr303/bin/ruff check .

      - name: Mypy
        run: .venv-pr303/bin/mypy

      - name: Full pytest
        run: .venv-pr303/bin/pytest

      - name: Commit tested hardening
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix final typed-package integrity review findings"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Report hardening failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="PR303 one-shot hardening failed on staging head ${GITHUB_SHA}. Actions run id: ${GITHUB_RUN_ID}. No tested hardening commit was pushed."
          payload=$(BODY="$body" python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/303/comments" \
            -d "$payload"
