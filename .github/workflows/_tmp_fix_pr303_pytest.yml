name: Temporary PR303 pytest compatibility fix

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1
    paths:
      - .github/workflows/_tmp_fix_pr303_pytest.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typed-research-package-assembler-v2-1
          fetch-depth: 0
      - name: Apply compatibility fixes
        run: python scripts/_tmp_fix_pr303_pytest.py
      - name: Remove temporary runner
        run: |
          rm scripts/_tmp_fix_pr303_pytest.py
          rm .github/workflows/_tmp_fix_pr303_pytest.yml
      - name: Commit compatibility fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve canonical Decision View validation compatibility"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
