name: PR303 clean transient validation environment

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1

permissions:
  contents: write

concurrency:
  group: pr303-clean-transient-venv
  cancel-in-progress: true

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/work"
          git checkout -B "${GITHUB_REF_NAME}" refs/remotes/origin/work
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Remove transient validation environment
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .venv-pr303
          if ! grep -qxF '.venv-pr303/' .gitignore; then
            printf '\n.venv-pr303/\n' >> .gitignore
          fi
          rm -f .github/workflows/pr303-clean-transient-venv.yml
          git add .gitignore .github/workflows/pr303-clean-transient-venv.yml

      - name: Commit cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove transient PR303 validation environment"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
