name: Temporary PR303 Helper Compatibility Fix

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply compatibility patch and remove temporary runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/patch"
          git checkout -B "${GITHUB_REF_NAME}" refs/remotes/origin/patch
          python3 scripts/_tmp_fix_pr303_helper_compat.py
          rm scripts/_tmp_fix_pr303_helper_compat.py .github/workflows/_tmp_fix_pr303_helper_compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve package helper compatibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
