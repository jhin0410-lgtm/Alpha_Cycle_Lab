name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - id: pytest
        shell: bash
        run: |
          set +e
          pytest 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}
          path: pytest.log
      - name: Enforce pytest result
        shell: bash
        run: test "${{ steps.pytest.outputs.status }}" -eq 0
