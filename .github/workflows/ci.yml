name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - name: Run pytest diagnostics
        run: |
          set +e
          pytest > pytest.txt 2>&1
          echo $? > pytest-exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-broker-reconciliation-${{ matrix.python-version }}
          path: |
            pytest.txt
            pytest-exit.txt
      - name: Enforce pytest result
        run: test "$(cat pytest-exit.txt)" = "0"
