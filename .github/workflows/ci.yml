name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - id: ruff
        shell: bash
        run: |
          set +e
          ruff check . 2>&1 | tee ruff.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: ruff.log
      - name: Enforce Ruff result
        shell: bash
        run: test "${{ steps.ruff.outputs.status }}" -eq 0
      - run: mypy
      - run: pytest
