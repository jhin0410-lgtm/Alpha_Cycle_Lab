name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact event ref without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event"
          git checkout --detach refs/remotes/origin/event
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"CI requires Python 3.12, found {sys.version}")
          PY
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        run: .venv-ci/bin/ruff check .

      - name: Mypy
        run: .venv-ci/bin/mypy

      - name: Pytest
        shell: bash
        run: |
          set +e
          .venv-ci/bin/pytest --junitxml=.pytest-results.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('.pytest-results.xml')
          if path.is_file():
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  node = failure if failure is not None else error
                  if node is None:
                      continue
                  file_path = case.attrib.get('file', 'tests')
                  name = case.attrib.get('name', 'unknown')
                  text = ' '.join((node.text or node.attrib.get('message', '')).split())
                  print(f'::error file={file_path}::pytest {name}: {text[:3500]}')
          PY
          fi
          exit "$status"
