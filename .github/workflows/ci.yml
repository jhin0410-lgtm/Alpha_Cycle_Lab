name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        run: ruff check . > ruff.txt 2>&1 || true
      - name: Capture mypy diagnostics
        run: mypy > mypy.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            ruff.txt
            mypy.txt
      - run: pytest
