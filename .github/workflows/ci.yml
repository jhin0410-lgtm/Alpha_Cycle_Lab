name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff auto-fix
        shell: bash
        run: |
          ruff check . --fix || true
          git diff > ruff-fix.diff
          ruff check . > ruff.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-fix-${{ matrix.python-version }}
          path: |
            ruff-fix.diff
            ruff.log
      - run: mypy
      - run: pytest
