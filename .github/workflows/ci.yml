name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact event ref without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event"
          git checkout --detach refs/remotes/origin/event
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"CI requires Python 3.12, found {sys.version}")
          PY
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        run: .venv-ci/bin/ruff check . --fix --diff

      - name: Mypy
        run: .venv-ci/bin/mypy

      - name: Pytest
        run: .venv-ci/bin/pytest
