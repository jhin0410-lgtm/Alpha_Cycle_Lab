name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Ruff diagnostics
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check . > ruff.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat ruff.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: ruff.log
      - name: Enforce Ruff result
        shell: bash
        run: exit "${{ steps.ruff.outputs.status }}"
      - run: mypy
      - run: pytest
