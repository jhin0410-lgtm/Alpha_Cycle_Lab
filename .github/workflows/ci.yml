name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply Ruff auto-fix for diagnostics
        run: ruff check . --fix
      - name: Run mypy diagnostics
        id: mypy
        shell: bash
        run: |
          set +e
          mypy > mypy.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat mypy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics-${{ matrix.python-version }}
          path: mypy.log
      - name: Enforce mypy result
        shell: bash
        run: exit "${{ steps.mypy.outputs.status }}"
      - run: pytest
