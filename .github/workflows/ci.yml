name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        run: |
          set +e
          python -m ruff check . > ruff-compressed-response.txt 2>&1
          echo $? > ruff-compressed-response.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-compressed-response-${{ matrix.python-version }}
          path: |
            ruff-compressed-response.txt
            ruff-compressed-response.exit
      - name: Enforce Ruff result
        run: test "$(cat ruff-compressed-response.exit)" = "0"
      - run: mypy
      - run: pytest
