name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Ruff diagnostics
        run: |
          set +e
          ruff check . > ruff.txt 2>&1
          echo $? > ruff-exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: |
            ruff.txt
            ruff-exit.txt
      - name: Enforce Ruff result
        run: test "$(cat ruff-exit.txt)" = "0"
      - run: mypy
      - run: pytest
