name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact event ref without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event"
          git checkout --detach refs/remotes/origin/event
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"CI requires Python 3.12, found {sys.version}")
          PY
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        run: .venv-ci/bin/ruff check .

      - name: Mypy
        shell: bash
        run: |
          set +e
          output="$(.venv-ci/bin/mypy 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^([^:]+):([0-9]+):\ error:\ (.*)$ ]]; then
                file="${BASH_REMATCH[1]}"
                lineno="${BASH_REMATCH[2]}"
                message="${BASH_REMATCH[3]}"
                echo "::error file=${file},line=${lineno}::${message}"
              fi
            done <<< "$output"
          fi
          exit "$status"

      - name: Pytest
        run: .venv-ci/bin/pytest
