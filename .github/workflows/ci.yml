name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Run mypy diagnostics
        run: |
          set +e
          mypy > mypy.txt 2>&1
          echo $? > mypy-exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mypy-broker-reconciliation-${{ matrix.python-version }}
          path: |
            mypy.txt
            mypy-exit.txt
      - name: Enforce mypy result
        run: test "$(cat mypy-exit.txt)" = "0"
      - run: pytest
