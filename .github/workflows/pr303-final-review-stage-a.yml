name: PR303 Final Review Hardening Stage A

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact push head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -B feature/typed-research-package-assembler-v2-1 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply final-review publication and blocker hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/alpha_cycle/research_package_assembler_v2_1.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"expected assembler fragment missing: {old[:80]!r}")
              text = text.replace(old, new, 1)

          def replace_function(name: str, replacement: str) -> None:
              global text
              marker = f"def {name}("
              start = text.index(marker)
              next_start = text.find("\ndef ", start + len(marker))
              if next_start < 0:
                  raise SystemExit(f"cannot find end of function {name}")
              text = text[:start] + replacement.rstrip() + "\n\n" + text[next_start + 1:]

          replace_once(
              "from alpha_cycle.research_package_integrity_v2_1 import (\n    decision_view_has_valid_persisted_selection,",
              "from alpha_cycle.research_package_integrity_v2_1 import (\n    ResearchPackageIntegrityError,\n    decision_view_has_valid_persisted_selection,",
          )

          owned_block = '''@dataclass(frozen=True)\nclass _OwnedFilePublication:\n    path: Path\n    inode: int\n    mtime_ns: int\n    size: int\n    sha256: str\n'''
          pinned_block = owned_block + '''\n\n@dataclass\nclass _PinnedRepository:\n    public_path: Path\n    io_path: Path\n    fd: int | None\n    device: int\n    inode: int\n\n\n@dataclass\nclass _PinnedPublicationRoot:\n    public_root: Path\n    io_root: Path\n    fd: int | None\n    device: int\n    inode: int\n    repositories: list[_PinnedRepository]\n'''
          replace_once(owned_block, pinned_block)

          replace_once(
              '''        except ResearchPackageSourceRevalidationError:\n            underwriting_evidence_valid = False\n''',
              '''        except (\n            ResearchPackageSourceRevalidationError,\n            OSError,\n            TypeError,\n            ValueError,\n        ):\n            underwriting_evidence_valid = False\n''',
          )

          old_view = '''    if (\n        view is not None\n        and artifact_root is not None\n        and not decision_view_has_valid_persisted_selection(\n            view,\n            artifact_root=artifact_root,\n        )\n    ):\n        _block(\n            blockers,\n            "research_package",\n            "decision_view_persisted_selection_invalid",\n            security_id,\n        )\n    if underwriting is not None and view is not None and underwriting.lane is UnderwritingLane.DEEP:\n        if not decision_view_matches_underwriting_tournament(\n            view, underwriting, artifact_root=artifact_root\n        ):\n            _block(\n                blockers,\n                "research_package",\n                "underwriting_decision_view_tournament_binding_mismatch",\n                security_id,\n            )\n'''
          new_view = '''    if view is not None and artifact_root is not None:\n        try:\n            persisted_selection_valid = decision_view_has_valid_persisted_selection(\n                view,\n                artifact_root=artifact_root,\n            )\n        except (ResearchPackageIntegrityError, OSError, TypeError, ValueError):\n            persisted_selection_valid = False\n        if not persisted_selection_valid:\n            _block(\n                blockers,\n                "research_package",\n                "decision_view_persisted_selection_invalid",\n                security_id,\n            )\n    if underwriting is not None and view is not None and underwriting.lane is UnderwritingLane.DEEP:\n        try:\n            tournament_binding_valid = decision_view_matches_underwriting_tournament(\n                view, underwriting, artifact_root=artifact_root\n            )\n        except (ResearchPackageIntegrityError, OSError, TypeError, ValueError):\n            tournament_binding_valid = False\n        if not tournament_binding_valid:\n            _block(\n                blockers,\n                "research_package",\n                "underwriting_decision_view_tournament_binding_mismatch",\n                security_id,\n            )\n'''
          replace_once(old_view, new_view)

          helpers = r'''def _directory_open_flags() -> int:\n    flags = os.O_RDONLY\n    if hasattr(os, "O_DIRECTORY"):\n        flags |= os.O_DIRECTORY\n    if hasattr(os, "O_NOFOLLOW"):\n        flags |= os.O_NOFOLLOW\n    return flags\n\n\ndef _fd_directory_path(fd: int, fallback: Path) -> Path:\n    for prefix in (Path("/proc/self/fd"), Path("/dev/fd")):\n        candidate = prefix / str(fd)\n        if candidate.exists():\n            return candidate\n    return fallback\n\n\ndef _open_pinned_publication_root(root: Path) -> _PinnedPublicationRoot:\n    public_root = require_trusted_artifact_root(root)\n    lexical = os.stat(public_root, follow_symlinks=False)\n    if os.name == "nt":\n        return _PinnedPublicationRoot(\n            public_root=public_root,\n            io_root=public_root,\n            fd=None,\n            device=lexical.st_dev,\n            inode=lexical.st_ino,\n            repositories=[],\n        )\n    fd = os.open(public_root, _directory_open_flags())\n    try:\n        opened = os.fstat(fd)\n        if (opened.st_dev, opened.st_ino) != (lexical.st_dev, lexical.st_ino):\n            raise ResearchPackageIntegrityError(\n                "artifact_root changed while pinning publication namespace"\n            )\n        return _PinnedPublicationRoot(\n            public_root=public_root,\n            io_root=_fd_directory_path(fd, public_root),\n            fd=fd,\n            device=opened.st_dev,\n            inode=opened.st_ino,\n            repositories=[],\n        )\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _pin_publication_repository(\n    publication_root: _PinnedPublicationRoot,\n    repository_name: str,\n) -> _PinnedRepository:\n    if not repository_name or Path(repository_name).name != repository_name:\n        raise ValueError("publication repository name must be one path component")\n    public_path = publication_root.public_root / repository_name\n    if publication_root.fd is None:\n        public_path.mkdir(parents=False, exist_ok=True)\n        if public_path.is_symlink() or not public_path.is_dir():\n            raise ResearchPackageIntegrityError(\n                f"publication repository must be a regular directory: {repository_name}"\n            )\n        stat = os.stat(public_path, follow_symlinks=False)\n        repository = _PinnedRepository(\n            public_path=public_path,\n            io_path=public_path,\n            fd=None,\n            device=stat.st_dev,\n            inode=stat.st_ino,\n        )\n        publication_root.repositories.append(repository)\n        return repository\n    try:\n        os.mkdir(repository_name, 0o755, dir_fd=publication_root.fd)\n    except FileExistsError:\n        pass\n    fd = os.open(repository_name, _directory_open_flags(), dir_fd=publication_root.fd)\n    try:\n        opened = os.fstat(fd)\n        lexical = os.stat(public_path, follow_symlinks=False)\n        if (opened.st_dev, opened.st_ino) != (lexical.st_dev, lexical.st_ino):\n            raise ResearchPackageIntegrityError(\n                f"publication repository changed while pinning: {repository_name}"\n            )\n        repository = _PinnedRepository(\n            public_path=public_path,\n            io_path=_fd_directory_path(fd, public_path),\n            fd=fd,\n            device=opened.st_dev,\n            inode=opened.st_ino,\n        )\n        publication_root.repositories.append(repository)\n        return repository\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _publication_namespace_is_current(publication_root: _PinnedPublicationRoot) -> bool:\n    try:\n        root_stat = os.stat(publication_root.public_root, follow_symlinks=False)\n        if (root_stat.st_dev, root_stat.st_ino) != (\n            publication_root.device,\n            publication_root.inode,\n        ):\n            return False\n        for repository in publication_root.repositories:\n            stat = os.stat(repository.public_path, follow_symlinks=False)\n            if (stat.st_dev, stat.st_ino) != (repository.device, repository.inode):\n                return False\n        return True\n    except OSError:\n        return False\n\n\ndef _close_pinned_publication_root(publication_root: _PinnedPublicationRoot) -> None:\n    for repository in reversed(publication_root.repositories):\n        if repository.fd is not None:\n            os.close(repository.fd)\n            repository.fd = None\n    if publication_root.fd is not None:\n        os.close(publication_root.fd)\n        publication_root.fd = None\n'''
          insertion_marker = "def _publish_orchestrated_artifacts("
          insert_at = text.index(insertion_marker)
          text = text[:insert_at] + helpers + "\n\n" + text[insert_at:]

          replace_function("_publish_orchestrated_artifacts", r'''def _publish_orchestrated_artifacts(\n    *,\n    artifacts: ResearchRoundArtifacts,\n    run: ResearchRoundRunSnapshot,\n    ledger: ResearchRunLedgerSnapshot,\n    root: Path,\n) -> tuple[Path, Path, Path]:\n    validate_publication_layout(root, artifacts=artifacts, run=run, ledger=ledger)\n    validate_existing_opportunity_artifacts(root, artifacts)\n    publication_root = _open_pinned_publication_root(root)\n    opportunity_publications: list[_OwnedOpportunityPublication] = []\n    owned_round: _OwnedFilePublication | None = None\n    owned_run: _OwnedFilePublication | None = None\n    owned_ledger: _OwnedFilePublication | None = None\n    try:\n        candidate_repository = _pin_publication_repository(\n            publication_root, "opportunity_candidate"\n        )\n        set_repository = (\n            _pin_publication_repository(publication_root, "opportunity_set")\n            if artifacts.opportunity_set is not None\n            else None\n        )\n        round_repository = _pin_publication_repository(\n            publication_root, "research_round_v2_1"\n        )\n        run_repository = _pin_publication_repository(\n            publication_root, "research_round_run_v2_1"\n        )\n        ledger_repository = _pin_publication_repository(\n            publication_root, "research_run_ledger_v2_1"\n        )\n        if not _publication_namespace_is_current(publication_root):\n            raise RuntimeError("publication namespace changed before artifact creation")\n\n        for candidate in artifacts.opportunity_candidates:\n            publication = _persist_owned_opportunity_snapshot(\n                candidate,\n                output_root=publication_root.public_root,\n                repository_root=candidate_repository.io_path,\n            )\n            opportunity_publications.append(publication)\n            if not _publication_namespace_is_current(publication_root):\n                raise RuntimeError("opportunity repository changed during publication")\n            validate_persisted_opportunity_candidate(\n                publication_root.public_root,\n                candidate,\n                require_pointer=_pointer_version_is_current(publication),\n            )\n            if not _publication_namespace_is_current(publication_root):\n                raise RuntimeError("opportunity repository changed during validation")\n        if artifacts.opportunity_set is not None:\n            if set_repository is None:\n                raise RuntimeError("opportunity-set repository pin missing")\n            publication = _persist_owned_opportunity_snapshot(\n                artifacts.opportunity_set,\n                output_root=publication_root.public_root,\n                repository_root=set_repository.io_path,\n            )\n            opportunity_publications.append(publication)\n            if not _publication_namespace_is_current(publication_root):\n                raise RuntimeError("opportunity-set repository changed during publication")\n            validate_persisted_opportunity_set(\n                publication_root.public_root,\n                artifacts.opportunity_set,\n                require_pointer=_pointer_version_is_current(publication),\n            )\n            if not _publication_namespace_is_current(publication_root):\n                raise RuntimeError("opportunity-set repository changed during validation")\n\n        _, owned_round = _persist_owned_content_addressed_json(\n            root=publication_root.public_root,\n            repository_name="research_round_v2_1",\n            repository_root=round_repository.io_path,\n            snapshot_id=artifacts.snapshot.snapshot_id,\n            payload_without_id=artifacts.snapshot.payload_without_id(),\n        )\n        _, owned_run = _persist_owned_content_addressed_json(\n            root=publication_root.public_root,\n            repository_name="research_round_run_v2_1",\n            repository_root=run_repository.io_path,\n            snapshot_id=run.snapshot_id,\n            payload_without_id=run.payload_without_id(),\n        )\n        if not _owned_file_is_current(owned_round) or not _owned_file_is_current(owned_run):\n            raise RuntimeError("round/run publication changed before ledger publication")\n        _, owned_ledger = _persist_owned_content_addressed_json(\n            root=publication_root.public_root,\n            repository_name="research_run_ledger_v2_1",\n            repository_root=ledger_repository.io_path,\n            snapshot_id=ledger.snapshot_id,\n            payload_without_id=ledger.payload_without_id(),\n        )\n        if not _owned_file_is_current(owned_round) or not _owned_file_is_current(owned_run):\n            raise RuntimeError("round/run publication changed during ledger publication")\n        if not _publication_namespace_is_current(publication_root):\n            raise RuntimeError("publication namespace changed before commit")\n        return (\n            publication_root.public_root\n            / "research_round_v2_1"\n            / f"{artifacts.snapshot.snapshot_id}.json",\n            publication_root.public_root\n            / "research_round_run_v2_1"\n            / f"{run.snapshot_id}.json",\n            publication_root.public_root\n            / "research_run_ledger_v2_1"\n            / f"{ledger.snapshot_id}.json",\n        )\n    except BaseException as exc:\n        cleanup_errors: list[BaseException] = []\n        for owned_file in (owned_ledger, owned_run, owned_round):\n            if owned_file is None:\n                continue\n            try:\n                _unlink_owned_file_if_current(owned_file)\n            except BaseException as cleanup_exc:\n                cleanup_errors.append(cleanup_exc)\n        for publication in reversed(opportunity_publications):\n            _rollback_owned_opportunity_publication(publication, cleanup_errors)\n        if cleanup_errors:\n            raise RuntimeError(\n                "orchestrated research publication failed and rollback was incomplete"\n            ) from cleanup_errors[0]\n        raise exc\n    finally:\n        _close_pinned_publication_root(publication_root)''')

          old_sig = '''def _persist_owned_opportunity_snapshot(\n    snapshot: OpportunityCandidateSnapshot | OpportunitySetSnapshot,\n    *,\n    output_root: Path,\n) -> _OwnedOpportunityPublication:\n'''
          new_sig = '''def _persist_owned_opportunity_snapshot(\n    snapshot: OpportunityCandidateSnapshot | OpportunitySetSnapshot,\n    *,\n    output_root: Path,\n    repository_root: Path | None = None,\n) -> _OwnedOpportunityPublication:\n'''
          replace_once(old_sig, new_sig)
          replace_once(
              '''    root = output_root / object_name\n    root_created = not root.exists()\n    root.mkdir(parents=True, exist_ok=True)\n    directory = _opportunity_snapshot_directory(\n        output_root,\n        object_name=object_name,\n        captured_at=snapshot.captured_at,\n        snapshot_id=snapshot.snapshot_id,\n    )\n''',
              '''    public_directory = _opportunity_snapshot_directory(\n        output_root,\n        object_name=object_name,\n        captured_at=snapshot.captured_at,\n        snapshot_id=snapshot.snapshot_id,\n    )\n    if repository_root is None:\n        root = output_root / object_name\n        root_created = not root.exists()\n        root.mkdir(parents=True, exist_ok=True)\n    else:\n        root = repository_root\n        root_created = False\n    directory = root / public_directory.name\n''',
          )
          replace_once('''            "snapshot_path": str(directory),\n''', '''            "snapshot_path": str(public_directory),\n''')

          old_content_start = '''def _persist_owned_content_addressed_json(\n    *,\n    root: Path,\n    repository_name: str,\n    snapshot_id: str,\n    payload_without_id: dict[str, object],\n) -> tuple[Path, _OwnedFilePublication]:\n    repository = root / repository_name\n    repository.mkdir(parents=True, exist_ok=True)\n'''
          new_content_start = '''def _persist_owned_content_addressed_json(\n    *,\n    root: Path,\n    repository_name: str,\n    snapshot_id: str,\n    payload_without_id: dict[str, object],\n    repository_root: Path | None = None,\n) -> tuple[Path, _OwnedFilePublication]:\n    repository = repository_root if repository_root is not None else root / repository_name\n    if repository_root is None:\n        repository.mkdir(parents=True, exist_ok=True)\n'''
          replace_once(old_content_start, new_content_start)

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_research_package_final_review_round3_v2_1.py")
          test_path.write_text(r'''from __future__ import annotations\n\nimport os\nfrom pathlib import Path\nfrom runpy import run_path\n\nimport pytest\n\nimport alpha_cycle.research_package_assembler_v2_1 as assembler\nfrom alpha_cycle.intelligence.opportunity_set_v2_1 import (\n    OpportunityCandidateSnapshot,\n    OpportunityResearchClass,\n)\nfrom alpha_cycle.research_observatory_v2_1 import load_latest_observatory_state\n\n_FIXTURE = run_path(str(Path(__file__).with_name("test_research_package_assembler_v2_1.py")))\n_prepare_ready_request = _FIXTURE["_prepare_ready_request"]\n_persist_components = _FIXTURE["_persist_components"]\nNOW = _FIXTURE["NOW"]\nEVAL = _FIXTURE["EVAL"]\nGUARDRAIL = _FIXTURE["GUARDRAIL"]\n\n\ndef _candidate() -> OpportunityCandidateSnapshot:\n    return OpportunityCandidateSnapshot(\n        captured_at=NOW,\n        evaluation_date=EVAL,\n        security_id="000660",\n        thesis_snapshot_id="a" * 64,\n        underwriting_readiness_snapshot_id="b" * 64,\n        payoff_surface_snapshot_id="c" * 64,\n        horizon_trading_days=120,\n        research_class=OpportunityResearchClass.DEEP_READY,\n        bear_return_lower=-0.30,\n        base_return_lower=0.10,\n        base_return_upper=0.30,\n        bull_return_upper=0.60,\n        nearest_catalyst_id="fixture-catalyst",\n        nearest_catalyst_days=30,\n        nearest_catalyst_evidence_refs=("fixture-evidence",),\n        comparison_blockers=(),\n        flags=(),\n        guardrail_evidence_id=GUARDRAIL,\n    )\n\n\ndef _replace_repository_with_external_symlink(\n    repository: Path, outside: Path\n) -> Path:\n    displaced = repository.with_name(repository.name + "-displaced")\n    repository.rename(displaced)\n    try:\n        repository.symlink_to(outside, target_is_directory=True)\n    except OSError:\n        pytest.skip("directory symlink creation unavailable")\n    return displaced\n\n\ndef test_pinned_content_repository_never_follows_replaced_ancestor(tmp_path: Path) -> None:\n    root = tmp_path / "artifacts"\n    root.mkdir()\n    publication_root = assembler._open_pinned_publication_root(root)\n    repository = assembler._pin_publication_repository(\n        publication_root, "research_round_v2_1"\n    )\n    outside = tmp_path / "outside"\n    outside.mkdir()\n    displaced = _replace_repository_with_external_symlink(repository.public_path, outside)\n    try:\n        assembler._persist_owned_content_addressed_json(\n            root=publication_root.public_root,\n            repository_name="research_round_v2_1",\n            repository_root=repository.io_path,\n            snapshot_id="f" * 64,\n            payload_without_id={"value": 1},\n        )\n        assert list(outside.iterdir()) == []\n        assert (displaced / f"{'f' * 64}.json").is_file()\n        assert assembler._publication_namespace_is_current(publication_root) is False\n    finally:\n        assembler._close_pinned_publication_root(publication_root)\n\n\ndef test_pinned_opportunity_repository_never_follows_replaced_ancestor(tmp_path: Path) -> None:\n    root = tmp_path / "artifacts"\n    root.mkdir()\n    publication_root = assembler._open_pinned_publication_root(root)\n    repository = assembler._pin_publication_repository(\n        publication_root, "opportunity_candidate"\n    )\n    outside = tmp_path / "outside"\n    outside.mkdir()\n    displaced = _replace_repository_with_external_symlink(repository.public_path, outside)\n    try:\n        publication = assembler._persist_owned_opportunity_snapshot(\n            _candidate(),\n            output_root=publication_root.public_root,\n            repository_root=repository.io_path,\n        )\n        assert list(outside.iterdir()) == []\n        assert publication.directory.parent.samefile(displaced)\n        assert assembler._publication_namespace_is_current(publication_root) is False\n    finally:\n        assembler._close_pinned_publication_root(publication_root)\n\n\ndef test_malformed_valuation_source_becomes_current_package_blocker(tmp_path: Path) -> None:\n    theses = _prepare_ready_request(tmp_path)\n    _persist_components(tmp_path, theses)\n    manifest = next((tmp_path / "valuation_evidence").glob("*/manifest.json"))\n    manifest.write_text("{not-json", encoding="utf-8")\n\n    receipt = assembler.assemble_and_run_research_package(\n        request_id="typed-package-round",\n        round_id="round-malformed-valuation",\n        run_id="run-malformed-valuation",\n        processed_at=NOW + _FIXTURE["timedelta"](minutes=2),\n        artifact_root=tmp_path,\n    )\n    assert receipt.orchestrated is None\n    assert any(\n        blocker.code == "underwriting_persisted_evidence_canonical_mismatch"\n        for blocker in receipt.blockers\n    )\n    state = load_latest_observatory_state(tmp_path)\n    assert state is not None\n    assert {row.state for row in state.inbox} == {"pre_orchestration_blocked"}\n\n\ndef test_malformed_decision_view_source_becomes_current_package_blocker(tmp_path: Path) -> None:\n    theses = _prepare_ready_request(tmp_path)\n    _persist_components(tmp_path, theses)\n    payload = next(\n        (tmp_path / "decision_view_selection_rule").glob(\n            "*/decision_view_selection_rule.json"\n        )\n    )\n    payload.write_text("{not-json", encoding="utf-8")\n\n    receipt = assembler.assemble_and_run_research_package(\n        request_id="typed-package-round",\n        round_id="round-malformed-decision-view",\n        run_id="run-malformed-decision-view",\n        processed_at=NOW + _FIXTURE["timedelta"](minutes=2),\n        artifact_root=tmp_path,\n    )\n    assert receipt.orchestrated is None\n    assert any(\n        blocker.code in {\n            "decision_view_persisted_selection_invalid",\n            "underwriting_decision_view_tournament_binding_mismatch",\n        }\n        for blocker in receipt.blockers\n    )\n    state = load_latest_observatory_state(tmp_path)\n    assert state is not None\n    assert {row.state for row in state.inbox} == {"pre_orchestration_blocked"}\n''', encoding="utf-8")
          PY

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pr303-venv
          /tmp/pr303-venv/bin/python -m pip install --upgrade pip
          /tmp/pr303-venv/bin/python -m pip install -e ".[dev]"

      - name: Focused regression and quality
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pr303-venv/bin/ruff check src/alpha_cycle/research_package_assembler_v2_1.py tests/unit/test_research_package_final_review_round3_v2_1.py
          /tmp/pr303-venv/bin/pytest -q tests/unit/test_research_package_final_review_round3_v2_1.py tests/unit/test_research_package_exact_head_review_round2_v2_1.py
          /tmp/pr303-venv/bin/mypy
          /tmp/pr303-venv/bin/pytest -q

      - name: Commit tested hardening only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr303-final-review-stage-a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alpha_cycle/research_package_assembler_v2_1.py tests/unit/test_research_package_final_review_round3_v2_1.py .github/workflows/pr303-final-review-stage-a.yml
          git diff --cached --check
          git commit -m "Harden PR303 publication repositories and blocker persistence"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
