name: Temporary PR303 final-four patch

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1
    paths:
      - .github/workflows/_tmp_patch_pr303_final4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typed-research-package-assembler-v2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final four review fixes
        run: python scripts/_tmp_patch_pr303_final4.py
      - name: Remove temporary patch runner
        run: |
          rm scripts/_tmp_patch_pr303_final4.py
          rm .github/workflows/_tmp_patch_pr303_final4.yml
      - name: Commit patched sources and regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden final Fast-Lane and component boundaries"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
