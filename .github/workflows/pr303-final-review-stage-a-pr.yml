name: PR303 Final Review Hardening Stage A PR Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feature/typed-research-package-assembler-v2-1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${PR_HEAD_SHA}"
          git checkout -B feature/typed-research-package-assembler-v2-1 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"

      - name: Execute staged Stage A hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BOOT'
          from pathlib import Path

          workflow = Path('.github/workflows/pr303-final-review-stage-a.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          exec(compile(code, '<pr303-stage-a>', 'exec'), {})
          BOOT

      - name: Normalize generated Stage A raw blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def normalize_generated_raw_blocks(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              physical_lines = text.splitlines(keepends=True)
              normalized = ''.join(
                  line.replace('\\n', '\n') if line.count('\\n') >= 3 else line
                  for line in physical_lines
              )
              path.write_text(normalized, encoding='utf-8')

          source = Path('src/alpha_cycle/research_package_assembler_v2_1.py')
          regression = Path('tests/unit/test_research_package_final_review_round3_v2_1.py')
          normalize_generated_raw_blocks(source)
          normalize_generated_raw_blocks(regression)

          text = source.read_text(encoding='utf-8')
          old = 'def _publication_namespace_is_current(publication_root: _PinnedPublicationRoot) -> bool:'
          new = (
              'def _publication_namespace_is_current(\n'
              '    publication_root: _PinnedPublicationRoot,\n'
              ') -> bool:'
          )
          if old not in text:
              raise SystemExit('expected Stage A signature not found')
          source.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply descriptor-relative publication patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr303_stage_a_fd_patch.py
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/unit/test_research_package_final_review_round3_v2_1.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_path.write_text(test_text.replace('import os\n', '', 1), encoding='utf-8')

          source = Path('src/alpha_cycle/research_package_assembler_v2_1.py')
          text = source.read_text(encoding='utf-8')
          replacements = (
              ('previous_temp, _ = _write_owned_pointer_temp_at(', 'previous_temp_name, _ = _write_owned_pointer_temp_at('),
              ('publication.repository_fd,\n                        previous_temp,\n                        publication.pointer.name,', 'publication.repository_fd,\n                        previous_temp_name,\n                        publication.pointer.name,'),
              ('os.unlink(previous_temp, dir_fd=publication.repository_fd)', 'os.unlink(previous_temp_name, dir_fd=publication.repository_fd)'),
              ('previous_temp = _write_owned_pointer_temp(\n            publication.root,', 'previous_temp_path = _write_owned_pointer_temp(\n            publication.root,'),
              ('_replace_pointer_if_version_matches(\n                previous_temp,\n                publication.pointer,', '_replace_pointer_if_version_matches(\n                previous_temp_path,\n                publication.pointer,'),
              ('previous_temp.unlink(missing_ok=True)', 'previous_temp_path.unlink(missing_ok=True)'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected generated rollback fragment missing: {old!r}')
              text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')
          PY

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pr303-venv
          /tmp/pr303-venv/bin/python -m pip install --upgrade pip
          /tmp/pr303-venv/bin/python -m pip install -e ".[dev]"

      - name: Focused regression and full quality gate
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pr303-venv/bin/ruff check src/alpha_cycle/research_package_assembler_v2_1.py tests/unit/test_research_package_final_review_round3_v2_1.py
          /tmp/pr303-venv/bin/pytest -q tests/unit/test_research_package_final_review_round3_v2_1.py tests/unit/test_research_package_exact_head_review_round2_v2_1.py
          /tmp/pr303-venv/bin/mypy
          /tmp/pr303-venv/bin/pytest -q

      - name: Commit exact tested Stage A files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr303-final-review-stage-a.yml .github/workflows/pr303-final-review-stage-a-pr.yml .github/pr303_stage_a_fd_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alpha_cycle/research_package_assembler_v2_1.py tests/unit/test_research_package_final_review_round3_v2_1.py .github/workflows/pr303-final-review-stage-a.yml .github/workflows/pr303-final-review-stage-a-pr.yml .github/pr303_stage_a_fd_patch.py
          git diff --cached --check
          git commit -m "Harden PR303 descriptor-relative publication integrity"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
