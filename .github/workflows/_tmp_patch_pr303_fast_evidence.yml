name: Temporary PR303 Fast evidence patcher

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1
    paths:
      - .github/workflows/_tmp_patch_pr303_fast_evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typed-research-package-assembler-v2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final Fast evidence patch
        run: python scripts/_tmp_patch_pr303_fast_evidence.py
      - name: Commit patch and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alpha_cycle/research_package_integrity_v2_1.py src/alpha_cycle/research_package_assembler_v2_1.py tests/unit/test_research_package_last_review_v2_1.py
          git rm scripts/_tmp_patch_pr303_fast_evidence.py .github/workflows/_tmp_patch_pr303_fast_evidence.yml
          git commit -m "Substantiate Fast-Lane persisted evidence"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
