name: PR303 final hardening

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1
    paths:
      - .github/workflows/pr303-final-hardening.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/feature/typed-research-package-assembler-v2-1:refs/remotes/origin/pr303"
          git checkout -B feature/typed-research-package-assembler-v2-1 refs/remotes/origin/pr303
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply seven-finding hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr303_final_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              pattern = re.compile(re.escape(start) + r".*?(?=" + re.escape(end) + r")", re.S)
              updated, count = pattern.subn(replacement.rstrip() + "\\n\\n", text, count=1)
              if count != 1:
                  raise RuntimeError(f"{path}: could not replace block {start!r} -> {end!r}")
              write(path, updated)
          '''
          new = '''def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              try:
                  start_index = text.index(start)
                  end_index = text.index(end, start_index + len(start))
              except ValueError as exc:
                  raise RuntimeError(
                      f"{path}: could not replace block {start!r} -> {end!r}"
                  ) from exc
              updated = text[:start_index] + replacement.rstrip() + "\\n\\n" + text[end_index:]
              write(path, updated)
          '''
          if old not in text:
              raise SystemExit('replace_between helper did not match expected script text')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/pr303_final_hardening.py
          rm -f .github/pr303_final_hardening.py .github/workflows/pr303-final-hardening.yml

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pr303-final-hardening-venv
          /tmp/pr303-final-hardening-venv/bin/python -m pip install --upgrade pip
          /tmp/pr303-final-hardening-venv/bin/python -m pip install -e ".[dev]"

      - name: Normalize changed Python files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/alpha_cycle/research_package_assembler_v2_1.py
            src/alpha_cycle/research_package_source_revalidation_v2_1.py
            tests/unit/test_research_package_assembler_v2_1.py
            tests/unit/test_research_package_publication_rollback_v2_1.py
            tests/unit/test_research_package_exact_head_review_round2_v2_1.py
          )
          /tmp/pr303-final-hardening-venv/bin/ruff format "${files[@]}"
          /tmp/pr303-final-hardening-venv/bin/ruff check --fix "${files[@]}"

      - name: Ruff
        run: /tmp/pr303-final-hardening-venv/bin/ruff check .

      - name: Mypy
        run: /tmp/pr303-final-hardening-venv/bin/mypy

      - name: Full pytest
        run: /tmp/pr303-final-hardening-venv/bin/pytest

      - name: Commit only tested source and tests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git status --porcelain | grep -E '(^|/)(\.venv|venv|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)(/|$)'; then
            echo "Refusing to commit transient environment/cache files" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden PR303 final review findings"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
          echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report successful tested head
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          body="PR303 final seven-finding hardening passed Ruff, mypy, and full pytest. Tested commit pushed: ${TESTED_HEAD}. Actions run id: ${GITHUB_RUN_ID}."
          payload="$(BODY="$body" python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/303/comments" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_HEAD: ${{ steps.publish.outputs.tested_head }}

      - name: Report failed gate
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          body="PR303 final seven-finding hardening failed on staging head ${GITHUB_SHA}. Actions run id: ${GITHUB_RUN_ID}. No tested hardening commit was pushed."
          payload="$(BODY="$body" python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/303/comments" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
