name: Temporary PR303 test mock compatibility fix

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1
    paths:
      - .github/workflows/_tmp_fix_pr303_test_kwargs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typed-research-package-assembler-v2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix test mock signatures
        run: python scripts/_tmp_fix_pr303_test_kwargs.py
      - name: Commit fix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_research_package_last_review_v2_1.py
          git rm scripts/_tmp_fix_pr303_test_kwargs.py .github/workflows/_tmp_fix_pr303_test_kwargs.yml
          git commit -m "Preserve PR303 test mock compatibility"
          git push origin HEAD:feature/typed-research-package-assembler-v2-1
