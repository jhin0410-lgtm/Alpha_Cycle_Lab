name: PR303 pointer ownership hardening

on:
  push:
    branches:
      - feature/typed-research-package-assembler-v2-1

permissions:
  contents: write

concurrency:
  group: pr303-pointer-ownership-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/work"
          git checkout -B "${GITHUB_REF_NAME}" refs/remotes/origin/work
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Patch publication ownership and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/alpha_cycle/research_package_assembler_v2_1.py")
          text = source.read_text(encoding="utf-8")
          old = '''    pointer_temp = _write_owned_pointer_temp(root, pointer.name, pointer_after)\n    try:\n        if pointer_before is None:\n            try:\n                os.link(pointer_temp, pointer)\n            except FileExistsError:\n                # A concurrent publisher won the absent-pointer race; do not overwrite it.\n                pass\n        elif pointer_before_identity is not None:\n            _replace_pointer_if_version_matches(\n                pointer_temp,\n                pointer,\n                expected_bytes=pointer_before,\n                expected_identity=pointer_before_identity,\n            )\n    finally:\n        pointer_temp.unlink(missing_ok=True)\n    if pointer.exists() and not pointer.is_symlink() and pointer.read_bytes() == pointer_after:\n        stat = pointer.stat()\n        inode = stat.st_ino\n        mtime_ns = stat.st_mtime_ns\n        size = stat.st_size\n    else:\n        inode = -1\n        mtime_ns = -1\n        size = -1\n'''
          new = '''    pointer_temp = _write_owned_pointer_temp(root, pointer.name, pointer_after)\n    pointer_published_by_this_call = False\n    try:\n        if pointer_before is None:\n            try:\n                os.link(pointer_temp, pointer)\n                pointer_published_by_this_call = True\n            except FileExistsError:\n                # A concurrent publisher won the absent-pointer race; do not overwrite it and\n                # never infer ownership merely because its deterministic bytes match ours.\n                pointer_published_by_this_call = False\n        elif pointer_before_identity is not None:\n            pointer_published_by_this_call = _replace_pointer_if_version_matches(\n                pointer_temp,\n                pointer,\n                expected_bytes=pointer_before,\n                expected_identity=pointer_before_identity,\n            )\n    finally:\n        pointer_temp.unlink(missing_ok=True)\n    if (\n        pointer_published_by_this_call\n        and pointer.exists()\n        and not pointer.is_symlink()\n        and pointer.read_bytes() == pointer_after\n    ):\n        stat = pointer.stat()\n        inode = stat.st_ino\n        mtime_ns = stat.st_mtime_ns\n        size = stat.st_size\n    else:\n        inode = -1\n        mtime_ns = -1\n        size = -1\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one opportunity pointer ownership block")
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/unit/test_research_package_exact_head_review_v2_1.py")
          text = test.read_text(encoding="utf-8")
          import_anchor = '''from alpha_cycle.research_package_source_revalidation_v2_1 import (\n    epistemic_package_sources_are_canonical,\n    forward_valuation_sources_are_canonical,\n    price_implied_sources_are_canonical,\n)\n'''
          import_replacement = import_anchor + '''from alpha_cycle.intelligence.opportunity_set_v2_1 import (\n    OpportunityCandidateSnapshot,\n    OpportunityResearchClass,\n)\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit("expected source revalidation import anchor")
          text = text.replace(import_anchor, import_replacement)
          fixture_anchor = '''_prepare_ready_request = _FIXTURE["_prepare_ready_request"]\n'''
          fixture_replacement = fixture_anchor + '''NOW = _FIXTURE["NOW"]\nEVAL = _FIXTURE["EVAL"]\nGUARDRAIL = _FIXTURE["GUARDRAIL"]\n'''
          if text.count(fixture_anchor) != 1:
              raise SystemExit("expected fixture anchor")
          text = text.replace(fixture_anchor, fixture_replacement)
          text += '''\n\ndef test_absent_pointer_link_loser_never_claims_foreign_equal_bytes(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    candidate = OpportunityCandidateSnapshot(\n        captured_at=NOW,\n        evaluation_date=EVAL,\n        security_id="000660",\n        thesis_snapshot_id="a" * 64,\n        underwriting_readiness_snapshot_id="b" * 64,\n        payoff_surface_snapshot_id="c" * 64,\n        horizon_trading_days=120,\n        research_class=OpportunityResearchClass.DEEP_READY,\n        bear_return_lower=-0.30,\n        base_return_lower=0.10,\n        base_return_upper=0.30,\n        bull_return_upper=0.60,\n        nearest_catalyst_id="fixture-catalyst",\n        nearest_catalyst_days=30,\n        nearest_catalyst_evidence_refs=("fixture-evidence",),\n        comparison_blockers=(),\n        flags=(),\n        guardrail_evidence_id=GUARDRAIL,\n    )\n    real_link = os.link\n    raced = False\n\n    def racing_link(src, dst, *args, **kwargs):\n        nonlocal raced\n        destination = Path(dst)\n        if destination.name == "latest_opportunity_candidate.json" and not raced:\n            raced = True\n            destination.write_bytes(Path(src).read_bytes())\n            raise FileExistsError(destination)\n        return real_link(src, dst, *args, **kwargs)\n\n    monkeypatch.setattr(os, "link", racing_link)\n    publication = assembler._persist_owned_opportunity_snapshot(\n        candidate, output_root=tmp_path\n    )\n    assert publication.pointer_inode == -1\n    foreign_bytes = publication.pointer.read_bytes()\n    cleanup_errors: list[BaseException] = []\n    assembler._rollback_owned_opportunity_publication(publication, cleanup_errors)\n    assert cleanup_errors == []\n    assert publication.pointer.exists()\n    assert publication.pointer.read_bytes() == foreign_bytes\n    assert publication.directory.exists()\n'''
          test.write_text(text, encoding="utf-8")

          doc = Path("docs/TYPED_RESEARCH_PACKAGE_ASSEMBLER_V2_1.md")
          text = doc.read_text(encoding="utf-8")
          marker = "Publication remains ledger-last."
          addition = (
              " Publication ownership is recorded only from a successful no-replace link or "
              "conditional replacement; equal bytes from a competing publisher never imply "
              "transaction ownership."
          )
          if marker not in text:
              raise SystemExit("expected publication documentation marker")
          if addition.strip() not in text:
              text = text.replace(marker, marker + addition, 1)
          doc.write_text(text, encoding="utf-8")
          PY

      - name: Create isolated validation environment outside repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pr303-venv
          /tmp/pr303-venv/bin/python -m pip install --upgrade pip
          /tmp/pr303-venv/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pr303-venv/bin/ruff check tests/unit/test_research_package_exact_head_review_v2_1.py --fix
          /tmp/pr303-venv/bin/ruff check .

      - name: Mypy
        run: /tmp/pr303-venv/bin/mypy

      - name: Full pytest
        run: /tmp/pr303-venv/bin/pytest

      - name: Commit only tested source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr303-pointer-ownership-fix.yml
          git add src/alpha_cycle/research_package_assembler_v2_1.py \
                  tests/unit/test_research_package_exact_head_review_v2_1.py \
                  docs/TYPED_RESEARCH_PACKAGE_ASSEMBLER_V2_1.md \
                  .github/workflows/pr303-pointer-ownership-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix opportunity pointer publication ownership"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
