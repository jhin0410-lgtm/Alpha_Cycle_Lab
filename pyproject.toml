[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-cycle-lab"
version = "0.1.0"
description = "Deterministic event-driven research backtesting core"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "License under review; see LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pypdf>=6.14,<7",
  "PyYAML>=6.0,<7",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2",
  "pytest<10,>=8.3",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0",
]

[project.scripts]
alpha-cycle = "alpha_cycle.cli:main"
alpha-cycle-decision = "alpha_cycle.decision_cli:main"
alpha-cycle-kis-expectation-crosscheck = "alpha_cycle.kis_expectation_semantic_crosscheck_cli:main"
alpha-cycle-kis-forward-estimates = "alpha_cycle.kis_forward_estimate_cli:main"
alpha-cycle-kis-forward-estimate-revisions = "alpha_cycle.kis_forward_estimate_revision_cli:main"
alpha-cycle-kosis-discovery = "alpha_cycle.kosis_industry_discovery_cli:main"
alpha-cycle-kosis-inventory = "alpha_cycle.kosis_industry_inventory_cli:main"
alpha-cycle-kosis-parameters = "alpha_cycle.kosis_industry_parameter_cli:main"
alpha-cycle-kosis-semiconductor-history = "alpha_cycle.kosis_semiconductor_history_cli:main"
alpha-cycle-kosis-semiconductor-sources = "alpha_cycle.kosis_semiconductor_source_discovery_cli:main"
alpha-cycle-live = "alpha_cycle.live_pipeline_provenance_cli:main"
alpha-cycle-macro-liquidity = "alpha_cycle.macro_liquidity_cli:main"
alpha-cycle-opendart-provisional-earnings = "alpha_cycle.opendart_provisional_earnings_cli:main"
alpha-cycle-resume = "alpha_cycle.resume_pipeline_provenance_cli:main"
alpha-cycle-sec-company-actual = "alpha_cycle.sec_company_actual_cli:main"
alpha-cycle-semiconductor-accounting-identity = "alpha_cycle.semiconductor_accounting_identity_cli:main"
alpha-cycle-semiconductor-baseline-reconciliation = "alpha_cycle.semiconductor_baseline_reconciliation_cli:main"
alpha-cycle-semiconductor-forward-input = "alpha_cycle.semiconductor_forward_input_cli:main"
alpha-cycle-semiconductor-historical-official-ir = "alpha_cycle.semiconductor_historical_official_ir_cli:main"
alpha-cycle-semiconductor-operating-assumptions = "alpha_cycle.semiconductor_operating_assumption_cli:main"
alpha-cycle-semiconductor-structural-evidence = "alpha_cycle.semiconductor_structural_evidence_cli:main"
alpha-cycle-valuation = "alpha_cycle.valuation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/alpha_cycle/paper/state.py" = ["E501", "UP017"]
