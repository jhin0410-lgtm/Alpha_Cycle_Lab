[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alpha_cycle"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "alpha_cycle.paper.state"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "alpha_cycle.brokers.reconciliation"
disable_error_code = ["call-overload", "no-any-return"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.decision"
disable_error_code = ["arg-type", "call-overload", "union-attr"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.kis_forward_estimates"
disable_error_code = ["assignment", "call-overload"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.kis_forward_decision_evidence"
disable_error_code = ["arg-type", "call-overload"]

[[tool.mypy.overrides]]
module = "alpha_cycle.kis_forward_estimate_revision_cli"
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.outcomes"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.valuation"
disable_error_code = ["arg-type", "call-overload", "dict-item"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.semiconductor_earnings_transmission"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "alpha_cycle.intelligence.semiconductor_vertical"
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "alpha_cycle.live_pipeline_cli"
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "alpha_cycle.market_consistency_cli"
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "alpha_cycle.kosis_semiconductor_history_cli"
disable_error_code = ["operator"]
