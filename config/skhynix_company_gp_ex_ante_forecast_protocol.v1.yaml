schema_version: 1
protocol:
  protocol_id: skhynix_company_gp_ex_ante_quarterly_forecast
  protocol_version: 1.0-frozen-pre-pit-backtest
  status: frozen_pre_pit_backtest
  ticker: "000660"
  target_metric: company_gross_profit_krw_million
  scientific_scope: pre_earnings_company_gp_forecast
  bound_v5_method_evidence_id: e7507064c46f96e3e253c46f9bd958a0577bb183275a3960b8ad369b578aea38
  bound_v5_q3_protocol_evidence_id: 4ef7b8cd4aa322eedd55d1c342a14116e8bfebbfcdbf2d7dceb9a232461c2b92

  forecast_origin:
    rule: quarter_end_minus_30_calendar_days
    cutoff_time_local: "23:59:59"
    timezone: Asia/Seoul
    current_quarter_complete_at_cutoff: false
    earnings_release_may_not_be_used_to_define_cutoff: true

  development_periods:
    - 2017Q1
    - 2017Q2
    - 2017Q3
    - 2018Q1
    - 2018Q2
    - 2018Q3
    - 2019Q1
    - 2019Q2
    - 2019Q3
    - 2020Q1
    - 2020Q2
    - 2020Q3
    - 2023Q1
    - 2023Q2
    - 2023Q3
    - 2024Q1
    - 2024Q2
    - 2024Q3
    - 2025Q1
    - 2025Q2
    - 2025Q3

  contaminated_report_only_periods:
    - 2026Q1

  protected_future_outcomes:
    2026Q3:
      role: co_protected_prospective_candidate
      target_read_allowed_before_score: false
      current_quarter_actual_company_revenue_allowed_as_feature: false
      current_quarter_actual_product_revenue_allowed_as_feature: false
      current_quarter_actual_cycle_driver_outcome_allowed_as_feature: false
      may_share_future_target_with_frozen_v5_q3_holdout: true
      ex_ante_forecast_must_be_locked_by_origin: true
      fallback_if_origin_missed: 2026Q4
    2026Q4:
      role: fallback_prospective_ex_ante_holdout_candidate
      target_read_allowed_before_score: false
      final_estimator_must_be_frozen_before_origin: true

  point_in_time_policy:
    feature_snapshot_must_be_locked_before_target_join: true
    source_available_at_must_not_follow_forecast_origin: true
    direct_source_fact_or_deterministic_transform_required: true
    current_retrieval_of_historical_value_is_not_historical_vintage_proof: true
    revision_prone_series_requires_historical_version_or_prospective_snapshot: true
    immutable_timestamped_filing_may_be_retrieved_later_if_receipt_identity_is_pinned: true
    source_bytes_sha256_required: true
    current_quarter_earnings_actuals_prohibited_as_features: true
    target_metric_prohibited_in_feature_bundle: true

  historical_evaluation:
    scheme: chronological_expanding_window
    random_cross_validation_allowed: false
    future_period_features_in_earlier_fold_allowed: false
    primary_metric: mae_krw_million
    benchmark_id: previous_reported_quarter_gross_profit_persistence
    candidate_must_strictly_beat_benchmark: true
    minimum_scored_folds: 8
    minimum_training_rows_per_fold: 6
    condition_number_threshold: null
    parameter_stability_threshold: null

  model_development:
    estimator_frozen_in_this_protocol: false
    final_feature_set_frozen_in_this_protocol: false
    separate_estimator_freeze_required_before_prospective_forecast: true
    v5_coefficients_may_not_be_refit_by_ex_ante_layer: true
    v5_product_margin_interpretation_may_not_be_reopened: true
    candidate_architectures:
      - direct_company_gp_from_pit_features
      - pit_input_bridge_into_frozen_v5_company_gp_relation
    candidate_architecture_selection_is_not_yet_authorized: true

  readiness_gate:
    require_feature_registry_frozen_before_first_pit_backtest: true
    require_period_level_pit_audit: true
    require_model_specific_rank_and_dof_gate_after_estimator_freeze: true
    minimum_complete_development_rows_for_any_model: 12
    minimum_complete_rows_is_heuristic_floor_not_statistical_theorem: true

  trust_boundary:
    2026q3_source_outcome_loaded: false
    2026q3_target_read: false
    2026q3_evaluated: false
    2026q4_target_read: false
    numeric_forward_forecast_enabled: false
    fair_value_estimate_enabled: false
    target_price_enabled: false
    decision_score_enabled: false
    investment_action_enabled: false
