schema_version: 1
sources:
  samsung_ir:
    owner: Samsung Electronics
    role: issuer_ir
    primary_source: true
    domains:
      - samsung.com
      - news.samsung.com
    allowed_dimensions:
      - end_demand
      - hbm_demand_mix
      - hbm_capacity_yield
      - competitive_position
      - memory_pricing_direction
      - business_mix
      - capex_supply
      - catalyst
    numeric_memory_price_eligible: false

  sk_hynix_ir:
    owner: SK hynix
    role: issuer_ir
    primary_source: true
    domains:
      - skhynix.com
      - news.skhynix.com
    allowed_dimensions:
      - end_demand
      - hbm_demand_mix
      - hbm_capacity_yield
      - competitive_position
      - memory_pricing_direction
      - business_mix
      - capex_supply
      - catalyst
    numeric_memory_price_eligible: false

  micron_ir:
    owner: Micron Technology
    role: peer_ir
    primary_source: true
    domains:
      - micron.com
      - investors.micron.com
    allowed_dimensions:
      - end_demand
      - hbm_demand_mix
      - hbm_capacity_yield
      - competitive_position
      - memory_pricing_direction
      - capex_supply
      - industry_supply
      - catalyst
    numeric_memory_price_eligible: false

  nvidia_ir:
    owner: NVIDIA
    role: customer_ir
    primary_source: true
    domains:
      - nvidia.com
      - investor.nvidia.com
      - nvidianews.nvidia.com
    allowed_dimensions:
      - end_demand
      - hbm_demand_mix
      - qualification
      - customer_platform
      - catalyst
    numeric_memory_price_eligible: false

  amd_ir:
    owner: AMD
    role: customer_ir
    primary_source: true
    domains:
      - amd.com
      - ir.amd.com
    allowed_dimensions:
      - end_demand
      - hbm_demand_mix
      - qualification
      - customer_platform
      - catalyst
    numeric_memory_price_eligible: false

  us_bis:
    owner: U.S. Bureau of Industry and Security
