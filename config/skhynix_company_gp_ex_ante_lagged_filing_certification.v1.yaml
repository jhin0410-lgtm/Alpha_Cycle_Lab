    lagged_company_gross_profit: direct_source_fact
    lagged_company_gross_margin: deterministic_gross_profit_divided_by_revenue
    lagged_nand_revenue_share: deterministic_nand_revenue_divided_by_reported_company_revenue
    lagged_other_revenue_share: deterministic_other_revenue_divided_by_reported_company_revenue

  exclusions:
    q1_target_rows_supported: false
    reason_q1_targets_excluded: >-
      Prior-quarter Q4 product-revenue recovery is outside the registered source contract and
      Q4 prior-quarter earnings information is not generally available by the March 1-style
      Q1 forecast origin. No Q4 values are synthesized or backfilled.
    cycle_driver_features_certified_in_this_step: false
    macro_features_certified_in_this_step: false
    memory_price_feature_certified_in_this_step: false

  completion_gate:
