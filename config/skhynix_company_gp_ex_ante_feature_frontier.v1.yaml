schema_version: 1
frontier:
  frontier_id: skhynix_company_gp_ex_ante_pit_feature_frontier
  frontier_version: 1.0-frozen-pre-pit-backtest
  status: frozen_pre_pit_backtest
  ticker: "000660"
  protocol_path: config/skhynix_company_gp_ex_ante_forecast_protocol.v1.yaml

  provenance_classes:
    timestamped_immutable_filing:
      description: >-
        Issuer or regulator filing with a pinned receipt/publication identity. Later retrieval is
        permitted only when the historical document identity and source bytes are pinned.
      later_retrieval_can_support_historical_pit: true
    historical_version_archive:
      description: >-
        Revision-prone series with an official historical version, archive, or equivalent
        version identity proving the exact value available by the forecast origin.
      later_retrieval_can_support_historical_pit: true
    prospective_snapshot:
      description: >-
        Revision-prone source bytes captured and SHA-256 bound on or before the forecast origin.
      later_retrieval_can_support_historical_pit: false
    current_retrieval_only:
      description: >-
        Historical value retrieved now without a historical version identity. This is not
        point-in-time backtest evidence.
      later_retrieval_can_support_historical_pit: false

  features:
    - feature_id: lagged_company_revenue
      family: lagged_issuer_fundamentals
      transform: previous_reported_quarter_company_revenue_krw_million
      source_kind: opendart_or_issuer_filing
      source_authority: primary
      source_mutability: immutable_receipt_document
      acceptable_provenance_classes:
        - timestamped_immutable_filing
      current_source_identity_status: historical_receipt_certification_required
      historical_pit_fit_eligible_now: false
      prospective_capture_eligible: true

    - feature_id: lagged_company_gross_profit
